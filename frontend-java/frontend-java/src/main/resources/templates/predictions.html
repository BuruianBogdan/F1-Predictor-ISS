<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Predictions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/drivers}">Drivers</a>
    <a th:href="@{/constructors}">Constructors</a>
    <a th:href="@{/circuits}">Circuits</a>
    <a th:href="@{/races}">Races</a>
    <a th:href="@{/results}">Results</a>
    <a th:href="@{/standings}">Standings</a>
    <a th:href="@{/predictions}">Predictions</a>
    <a th:href="@{/import}">Import</a>
</div>

<div class="container">
    <h1>Predictions</h1>

    <div class="section">
        <h2>Championship Prediction</h2>
        <table>
            <thead>
            <tr>
                <th>Driver ID</th>
                <th>Name</th>
                <th>Code</th>
                <th>Predicted Score</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prediction : ${championPredictions}">
                <td th:text="${prediction.driver_id}"></td>
                <td th:text="${prediction.name}"></td>
                <td th:text="${prediction.code}"></td>
                <td th:text="${prediction.predicted_score}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Race Prediction</h2>

        <form method="get" th:action="@{/predictions}">
            <label for="raceId">Select Race</label>
            <select id="raceId" name="raceId">
                <option th:each="race : ${races}"
                        th:value="${race.race_id}"
                        th:text="${race.race_name + ' (' + race.season_year + ' - Round ' + race.round + ')'}">
                </option>
            </select>
            <button type="submit">Load Race Prediction</button>
        </form>

        <div th:if="${racePredictions != null}">
            <h3 th:text="'Race Prediction for race ID: ' + ${selectedRaceId}"></h3>
            <table>
                <thead>
                <tr>
                    <th>Result ID</th>
                    <th>Driver ID</th>
                    <th>Constructor ID</th>
                    <th>Grid</th>
                    <th>Position</th>
                    <th>Points</th>
                    <th>Status</th>
                    <th>Predicted Score</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prediction : ${racePredictions}">
                    <td th:text="${prediction.result_id}"></td>
                    <td th:text="${prediction.driver_id}"></td>
                    <td th:text="${prediction.constructor_id}"></td>
                    <td th:text="${prediction.grid}"></td>
                    <td th:text="${prediction.position}"></td>
                    <td th:text="${prediction.points}"></td>
                    <td th:text="${prediction.status}"></td>
                    <td th:text="${prediction.predicted_score}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
