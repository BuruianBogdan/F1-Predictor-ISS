<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Constructors</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <a th:href="@{/}">Dashboard</a>
    <a th:href="@{/drivers}">Drivers</a>
    <a th:href="@{/constructors}">Constructors</a>
    <a th:href="@{/circuits}">Circuits</a>
    <a th:href="@{/races}">Races</a>
    <a th:href="@{/results}">Results</a>
    <a th:href="@{/standings}">Standings</a>
    <a th:href="@{/predictions}">Predictions</a>
    <a th:href="@{/import}">Import</a>
</div>

<div class="container">
    <h1>Constructors</h1>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Reference</th>
            <th>Name</th>
            <th>Nationality</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="constructor : ${constructors}">
            <td th:text="${constructor.constructor_id}"></td>
            <td th:text="${constructor.constructor_ref}"></td>
            <td th:text="${constructor.name}"></td>
            <td th:text="${constructor.nationality}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
